<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Live</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/flv.js/dist/flv.min.js"></script>
</head>
<body>
    <div class="app-container" id="app-container">
        <header class="navbar" id="navbar">
            <div class="logo">Pure Live</div>
            <nav>
                <button id="nav-popular" class="active">热门</button>
                <button id="nav-categories">分类</button>
                <button id="nav-favorites">关注</button>
                <button id="nav-home">跳转</button>
                <button id="nav-settings">设置</button>
            </nav>
        </header>

        <!-- Back to top button -->
        <button id="back-to-top" class="hidden" title="返回顶部">↑</button>

        <main id="main-content">
            <!-- Main Player Container with Danmaku -->
            <div id="player-container" class="hidden">
                <div class="player-with-danmaku">
                    <div class="player-wrapper" id="player-wrapper">
                        <video id="videoElement" controls></video>
                        <!-- Auto-hiding overlay -->
                        <div class="player-overlay" id="player-overlay">
                            <div class="player-header">
                                <div class="player-info">
                                    <span id="player-title"></span>
                                    <span id="player-streamer"></span>
                                </div>
                                <div class="player-controls">
                                    <select id="quality-select" title="画质"></select>
                                    <select id="line-select" title="线路"></select>
                                    <button id="pip-btn" class="icon-btn" title="画中画">⧉</button>
                                    <button id="webfullscreen-btn" class="icon-btn" title="网页全屏">⛶</button>
                                    <button id="favorite-btn" class="icon-btn" title="关注">
                                        <span class="heart-icon">♡</span>
                                    </button>
                                    <button id="close-player" class="icon-btn" title="关闭">×</button>
                                </div>
                            </div>
                        </div>
                        <div class="volume-indicator hidden" id="volume-indicator">
                            <span id="volume-value">100%</span>
                        </div>
                    </div>
                    <!-- Danmaku Panel -->
                    <div class="danmaku-panel" id="danmaku-panel">
                        <div class="danmaku-header">
                            <span>弹幕</span>
                            <button id="toggle-danmaku" class="icon-btn-sm" title="开关弹幕">💬</button>
                        </div>
                        <div class="danmaku-list" id="danmaku-list"></div>
                        <div class="danmaku-status" id="danmaku-status">等待连接...</div>
                    </div>
                </div>
            </div>

            <!-- Popular Rooms Section (Default) -->
            <div id="popular-section" class="section">
                <h2>热门直播</h2>
                <div id="platform-tabs" class="platform-tabs"></div>
                <div id="popular-grid" class="grid"></div>
                <div class="pagination" id="popular-pagination">
                    <button id="popular-prev" class="page-btn" disabled>◀ 上一页</button>
                    <span id="popular-page-info">第 1 页</span>
                    <button id="popular-next" class="page-btn">下一页 ▶</button>
                </div>
                <div id="popular-loading" class="loading-indicator hidden">
                    <div class="spinner"></div>
                    <span>加载中...</span>
                </div>
                <div id="popular-error" class="error-message hidden">
                    <span>加载失败</span>
                    <button onclick="retryLoadPopular()">重试</button>
                </div>
            </div>

            <!-- Categories Section -->
            <div id="categories-section" class="section hidden">
                <h2>分类</h2>
                <div id="category-platform-tabs" class="platform-tabs"></div>
                <div id="category-list" class="category-list"></div>
                <div id="category-rooms-container" class="hidden">
                    <button id="back-to-categories" class="back-btn">← 返回分类</button>
                    <h3 id="category-title"></h3>
                    <div id="category-rooms-grid" class="grid"></div>
                    <div class="pagination" id="category-pagination">
                        <button id="category-prev" class="page-btn" disabled>◀ 上一页</button>
                        <span id="category-page-info">第 1 页</span>
                        <button id="category-next" class="page-btn">下一页 ▶</button>
                    </div>
                    <div id="category-loading" class="loading-indicator hidden">
                        <div class="spinner"></div>
                        <span>加载中...</span>
                    </div>
                    <div id="category-error" class="error-message hidden">
                        <span>加载失败</span>
                        <button onclick="retryLoadCategory()">重试</button>
                    </div>
                </div>
            </div>

            <!-- Favorites Section -->
            <div id="favorites-section" class="section hidden">
                <h2>我的关注</h2>
                <div id="favorites-grid" class="grid"></div>
                <p id="favorites-empty" class="empty-message hidden">还没有关注的直播间</p>
            </div>

            <!-- Direct Room Input Section -->
            <div id="input-section" class="section hidden">
                <h2>跳转直播间</h2>
                <div class="input-group">
                    <select id="platform-select">
                        <option value="bilibili">哔哩哔哩</option>
                        <option value="douyu">斗鱼</option>
                        <option value="huya">虎牙</option>
                        <option value="douyin">抖音</option>
                        <option value="kuaishou">快手</option>
                        <option value="cc">网易CC</option>
                    </select>
                    <input type="text" id="room-id-input" placeholder="输入房间号">
                    <button id="play-btn">播放</button>
                </div>
            </div>

            <!-- Settings Section -->
            <div id="settings-section" class="section hidden">
                <h2>设置</h2>
                <div class="setting-item">
                    <label>哔哩哔哩 Cookie</label>
                    <input type="text" id="bilibili-cookie" placeholder="用于获取高画质">
                    <button onclick="saveCookie('bilibili')">保存</button>
                </div>
                <div class="setting-item">
                    <label>抖音 Cookie</label>
                    <input type="text" id="douyin-cookie" placeholder="用于抖音直播">
                    <button onclick="saveCookie('douyin')">保存</button>
                </div>
                <div class="setting-item">
                    <label>虎牙 Cookie</label>
                    <input type="text" id="huya-cookie" placeholder="用于虎牙直播">
                    <button onclick="saveCookie('huya')">保存</button>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
